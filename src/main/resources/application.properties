spring.application.name=agritech-recommendation-api
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agritech}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

ai.base-url=${AI_BASE_URL:http://localhost:11434}
ai.model=${AI_MODEL:qwen2.5:0.5b}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
