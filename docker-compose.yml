services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-runtime:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ai-runtime:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${AI_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      ai-runtime:
        condition: service_healthy
    restart: "no"

  recommendation-api:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agritech
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AI_BASE_URL: http://ai-runtime:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:0.5b}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully

volumes:
  postgres_data:
  ollama_data:

networks:
  default:
    name: ai-network
