services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: agritech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agritech -d agritech"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m

  recommendation-api:
    image: ghcr.io/floydkuhlula91-lab/agritech-recommendation-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agritech
      SPRING_DATASOURCE_USERNAME: agritech
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AI_BASE_URL: ${AI_BASE_URL:?AI_BASE_URL must be set}
      AI_MODEL: ${AI_MODEL:-qwen2.5:0.5b}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m

volumes:
  postgres_data:
